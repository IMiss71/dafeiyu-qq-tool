name: ci

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: unit / static tests
        run: npm test
      - name: release gate (source, no manifest)
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/verify.ps1 -Stage . -SkipManifest

  source-package:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: build portable (no runtime payload)
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/build.ps1 -SkipInstaller
      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dafeiyu-source-package
          path: dist/*
